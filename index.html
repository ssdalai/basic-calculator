<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A simple, accessible calculator with light and dark modes."
    />
    <title>Basic Calculator</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="toolbar">
        <h1>Calculator</h1>
        <div class="toolbar-actions">
          <button
            type="button"
            id="history-toggle"
            class="history-toggle"
            aria-label="Show calculation history"
            aria-expanded="false"
          >
            <span aria-hidden="true">📜</span>
          </button>
          <button
            type="button"
            id="theme-toggle"
            class="theme-toggle"
            aria-label="Switch to dark mode"
          >
            <span class="theme-toggle-icon" aria-hidden="true">🌙</span>
            <span class="theme-toggle-label">Dark</span>
          </button>
        </div>
      </header>

      <main>
        <section class="calculator" aria-label="Calculator">
          <div class="display">
            <div id="expression" class="expression" aria-live="polite"></div>
            <div
              id="result"
              class="result"
              role="status"
              aria-live="polite"
              aria-atomic="true"
            >
              0
            </div>
          </div>

          <div class="keys" role="group" aria-label="Calculator keys">
            <button type="button" data-action="clear">AC</button>
            <button type="button" data-action="backspace">⌫</button>
            <button type="button" data-action="percent">%</button>
            <button type="button" data-operator="÷">÷</button>

            <button type="button" data-digit="7">7</button>
            <button type="button" data-digit="8">8</button>
            <button type="button" data-digit="9">9</button>
            <button type="button" data-operator="×">×</button>

            <button type="button" data-digit="4">4</button>
            <button type="button" data-digit="5">5</button>
            <button type="button" data-digit="6">6</button>
            <button type="button" data-operator="−">−</button>

            <button type="button" data-digit="1">1</button>
            <button type="button" data-digit="2">2</button>
            <button type="button" data-digit="3">3</button>
            <button type="button" data-operator="+">+</button>

            <button type="button" data-digit="0" class="span-2">0</button>
            <button type="button" data-action="decimal">.</button>
            <button type="button" data-action="equals" class="equals">=</button>
          </div>
        </section>
      </main>

      <footer>
        <p>Keyboard: numbers, +, −, *, /, Enter, Backspace, Escape.</p>
      </footer>
    </div>
    <aside
      id="history-panel"
      class="history-panel"
      role="dialog"
      aria-label="Calculation history"
      aria-hidden="true"
    >
      <header class="history-header">
        <h2>History</h2>
        <button
          type="button"
          id="history-close"
          class="history-close"
          aria-label="Close history"
        >
          <span aria-hidden="true">✕</span>
        </button>
      </header>
      <div class="history-list" role="list"></div>
      <footer class="history-footer">
        <button
          type="button"
          id="history-clear"
          class="history-clear"
        >
          Clear All
        </button>
      </footer>
    </aside>
    <div id="history-backdrop" class="history-backdrop"></div>
    <script src="script.js"></script>
  </body>
</html>
